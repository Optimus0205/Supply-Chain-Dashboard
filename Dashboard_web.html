<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Supply Chain Analytics — Dashboard Prototype</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --navy: #1F3864;
    --navy-light: #2E5395;
    --blue: #2E75B6;
    --blue-light: #9DC3E6;
    --gray-bg: #F3F4F6;
    --gray-border: #DDE1E6;
    --gray-text: #5B6470;
    --dark-text: #1C2530;
    --red: #C0392B;
    --green: #2E7D32;
    --amber: #C77700;
    --card-radius: 8px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", "Segoe UI Web", -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;
    background: var(--gray-bg);
    color: var(--dark-text);
  }
  .topbar {
    background: var(--navy);
    color: white;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  .topbar h1 {
    font-size: 17px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.2px;
  }
  .topbar .subtitle {
    font-size: 11px;
    color: #B7C4DC;
    font-weight: 400;
    margin-top: 2px;
  }
  .filter-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .filter-row label {
    font-size: 12px;
    color: #DCE6F1;
  }
  select {
    font-family: inherit;
    font-size: 13px;
    padding: 6px 10px;
    border-radius: 5px;
    border: 1px solid var(--navy-light);
    background: white;
    color: var(--dark-text);
    cursor: pointer;
  }
  .tabs {
    display: flex;
    background: white;
    border-bottom: 1px solid var(--gray-border);
    padding: 0 24px;
    overflow-x: auto;
  }
  .tab {
    padding: 13px 18px;
    font-size: 13px;
    font-weight: 600;
    color: var(--gray-text);
    cursor: pointer;
    border-bottom: 3px solid transparent;
    white-space: nowrap;
    user-select: none;
  }
  .tab:hover { color: var(--navy); }
  .tab.active {
    color: var(--navy);
    border-bottom-color: var(--blue);
  }
  .page { display: none; padding: 20px 24px 40px; max-width: 1400px; margin: 0 auto; }
  .page.active { display: block; }
  .kpi-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 14px;
    margin-bottom: 18px;
  }
  .kpi-card {
    background: white;
    border-radius: var(--card-radius);
    border: 1px solid var(--gray-border);
    padding: 14px 16px;
  }
  .kpi-card .kpi-label {
    font-size: 11px;
    color: var(--gray-text);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    font-weight: 600;
  }
  .kpi-card .kpi-value {
    font-size: 24px;
    font-weight: 700;
    color: var(--navy);
    margin-top: 4px;
  }
  .kpi-card .kpi-sub {
    font-size: 11px;
    color: var(--gray-text);
    margin-top: 2px;
  }
  .grid-2 {
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 14px;
    margin-bottom: 14px;
  }
  .grid-2b {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 14px;
  }
  .card {
    background: white;
    border-radius: var(--card-radius);
    border: 1px solid var(--gray-border);
    padding: 16px;
  }
  .card h3 {
    font-size: 13px;
    font-weight: 600;
    color: var(--dark-text);
    margin: 0 0 12px 0;
  }
  .card .note {
    font-size: 11px;
    color: var(--gray-text);
    font-style: italic;
    margin-bottom: 8px;
  }
  canvas { max-height: 260px; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th {
    text-align: left;
    padding: 8px 10px;
    background: #EEF2F7;
    color: var(--gray-text);
    font-weight: 600;
    border-bottom: 1px solid var(--gray-border);
    position: sticky; top: 0;
  }
  td {
    padding: 7px 10px;
    border-bottom: 1px solid #F0F1F3;
  }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover { background: #F5F8FC; }
  .table-scroll { max-height: 320px; overflow-y: auto; }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 600;
  }
  .badge.late { background: #FCE8E6; color: var(--red); }
  .badge.ontime { background: #E6F4EA; color: var(--green); }
  .badge.advance { background: #E8F0FE; color: var(--blue); }
  .badge.canceled { background: #F1F1F1; color: var(--gray-text); }
  .back-link {
    font-size: 12px;
    color: var(--blue);
    cursor: pointer;
    margin-bottom: 10px;
    display: none;
  }
  .footer-note {
    font-size: 11px;
    color: var(--gray-text);
    text-align: center;
    padding: 16px;
  }
  .demand-banner {
    background: #FFF7E6;
    border: 1px solid #FFE0A3;
    color: #8A5A00;
    font-size: 12px;
    padding: 8px 14px;
    border-radius: 6px;
    margin-bottom: 14px;
  }
</style>
</head>

<script>
/* ================= STATE ================= */
let currentMarket = "All";
let currentPage = "exec";
let drillCustomerId = null;
const charts = {};

const fmtCurrency = n => "$" + Number(n).toLocaleString(undefined, {maximumFractionDigits:0});
const fmtNum = n => Number(n).toLocaleString();

/* ================= SETUP ================= */
const marketSelect = document.getElementById("marketFilter");
Object.keys(DASHBOARD_DATA.markets).forEach(m => {
  const opt = document.createElement("option");
  opt.value = m; opt.textContent = m === "All" ? "All Markets" : m;
  marketSelect.appendChild(opt);
});
marketSelect.addEventListener("change", e => {
  currentMarket = e.target.value;
  renderAll();
});

const PAGES = [
  {id: "exec", label: "Executive Overview"},
  {id: "logistics", label: "Logistics Performance"},
  {id: "customer", label: "Customer & Product"},
  {id: "ops", label: "Inventory / Operations"},
  {id: "detail", label: "Order Detail"}
];

const tabsEl = document.getElementById("tabs");
PAGES.forEach(p => {
  const t = document.createElement("div");
  t.className = "tab" + (p.id === currentPage ? " active" : "");
  t.textContent = p.label;
  t.dataset.page = p.id;
  t.addEventListener("click", () => switchPage(p.id));
  tabsEl.appendChild(t);
});

const pagesEl = document.getElementById("pages");
pagesEl.innerHTML = `
  <div class="page" id="page-exec"></div>
  <div class="page" id="page-logistics"></div>
  <div class="page" id="page-customer"></div>
  <div class="page" id="page-ops"></div>
  <div class="page" id="page-detail"></div>
`;

function switchPage(id) {
  currentPage = id;
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.page === id));
  document.querySelectorAll(".page").forEach(p => p.classList.toggle("active", p.id === "page-" + id));
}

function destroyChart(key) {
  if (charts[key]) { charts[key].destroy(); delete charts[key]; }
}

/* ================= PAGE RENDERERS ================= */
function renderExec(d) {
  const el = document.getElementById("page-exec");
  el.innerHTML = `
    <div class="kpi-row">
      <div class="kpi-card"><div class="kpi-label">Total Sales</div><div class="kpi-value">${fmtCurrency(d.kpis.totalSales)}</div></div>
      <div class="kpi-card"><div class="kpi-label">Total Profit</div><div class="kpi-value">${fmtCurrency(d.kpis.totalProfit)}</div></div>
      <div class="kpi-card"><div class="kpi-label">Total Orders</div><div class="kpi-value">${fmtNum(d.kpis.totalOrders)}</div></div>
      <div class="kpi-card"><div class="kpi-label">Customers</div><div class="kpi-value">${fmtNum(d.kpis.distinctCustomers)}</div></div>
      <div class="kpi-card"><div class="kpi-label">Late Delivery %</div><div class="kpi-value">${d.kpis.lateDeliveryPct}%</div></div>
    </div>
    <div class="grid-2">
      <div class="card"><h3>Sales &amp; Profit Trend</h3><canvas id="chart-exec-trend"></canvas></div>
      <div class="card"><h3>Sales by Region</h3><canvas id="chart-exec-region"></canvas></div>
    </div>
    <div class="grid-2b">
      <div class="card"><h3>Category Breakdown</h3><canvas id="chart-exec-category"></canvas></div>
      <div class="card"><h3>Top 5 Products by Sales</h3><canvas id="chart-exec-products"></canvas></div>
    </div>
  `;
  destroyChart("execTrend"); destroyChart("execRegion"); destroyChart("execCategory"); destroyChart("execProducts");

  charts.execTrend = new Chart(document.getElementById("chart-exec-trend"), {
    type: "line",
    data: {
      labels: d.monthlyTrend.map(m => m.month),
      datasets: [
        {label: "Sales", data: d.monthlyTrend.map(m => m.sales), borderColor: "#2E75B6", backgroundColor: "#2E75B633", tension: 0.25, fill: true, yAxisID: "y"},
        {label: "Profit", data: d.monthlyTrend.map(m => m.profit), borderColor: "#C77700", tension: 0.25, fill: false, yAxisID: "y"}
      ]
    },
    options: {responsive:true, maintainAspectRatio:true, plugins:{legend:{position:"bottom", labels:{boxWidth:10, font:{size:11}}}}, scales:{x:{ticks:{font:{size:9}, maxRotation:60}}, y:{ticks:{font:{size:10}}}}}
  });

  charts.execRegion = new Chart(document.getElementById("chart-exec-region"), {
    type: "bar",
    data: {labels: d.regionBreakdown.map(r=>r.region), datasets:[{label:"Sales", data:d.regionBreakdown.map(r=>r.sales), backgroundColor:"#2E75B6"}]},
    options: {indexAxis:"y", responsive:true, plugins:{legend:{display:false}}, scales:{x:{ticks:{font:{size:9}}}, y:{ticks:{font:{size:10}}}}}
  });

  charts.execCategory = new Chart(document.getElementById("chart-exec-category"), {
    type: "doughnut",
    data: {labels: d.categoryBreakdown.map(c=>c.name), datasets:[{data:d.categoryBreakdown.map(c=>c.sales), backgroundColor:["#1F3864","#2E75B6","#9DC3E6","#C77700","#8FAADC","#5B6470","#B7C4DC","#DDE1E6"]}]},
    options: {responsive:true, plugins:{legend:{position:"right", labels:{boxWidth:10, font:{size:10}}}}}
  });

  const topProds = d.topProducts.slice(0,5);
  charts.execProducts = new Chart(document.getElementById("chart-exec-products"), {
    type: "bar",
    data: {labels: topProds.map(p=>p.name), datasets:[{label:"Sales", data:topProds.map(p=>p.sales), backgroundColor:"#1F3864"}]},
    options: {indexAxis:"y", responsive:true, plugins:{legend:{display:false}}, scales:{x:{ticks:{font:{size:9}}}, y:{ticks:{font:{size:9}}}}}
  });
}

function renderLogistics(d) {
  const el = document.getElementById("page-logistics");
  const otif = (100 - d.kpis.lateDeliveryPct).toFixed(1);
  el.innerHTML = `
    <div class="kpi-row">
      <div class="kpi-card"><div class="kpi-label">Avg Delivery Days</div><div class="kpi-value">${d.kpis.avgDeliveryDays}</div></div>
      <div class="kpi-card"><div class="kpi-label">Avg Scheduled Days</div><div class="kpi-value">${d.kpis.avgScheduledDays}</div></div>
      <div class="kpi-card"><div class="kpi-label">Late Delivery %</div><div class="kpi-value">${d.kpis.lateDeliveryPct}%</div></div>
      <div class="kpi-card"><div class="kpi-label">OTIF % (proxy)</div><div class="kpi-value">${otif}%</div><div class="kpi-sub">Not a true OTIF — no quantity-fulfillment field in source data</div></div>
    </div>
    <div class="grid-2">
      <div class="card"><h3>Late Delivery Rate Trend</h3><canvas id="chart-log-trend"></canvas></div>
      <div class="card"><h3>Shipping Mode Comparison (avg days)</h3><canvas id="chart-log-mode"></canvas></div>
    </div>
    <div class="grid-2b">
      <div class="card"><h3>Delivery Status Breakdown</h3><canvas id="chart-log-status"></canvas></div>
      <div class="card"><h3>Region Performance (by late %)</h3><div class="table-scroll" id="log-region-table"></div></div>
    </div>
  `;
  destroyChart("logTrend"); destroyChart("logMode"); destroyChart("logStatus");

  charts.logTrend = new Chart(document.getElementById("chart-log-trend"), {
    type: "line",
    data: {labels: d.monthlyTrend.map(m=>m.month), datasets:[{label:"Late Delivery %", data:d.monthlyTrend.map(m=>m.lateRate), borderColor:"#C0392B", backgroundColor:"#C0392B22", fill:true, tension:0.25}]},
    options: {responsive:true, plugins:{legend:{display:false}}, scales:{x:{ticks:{font:{size:9}, maxRotation:60}}, y:{ticks:{font:{size:10}}}}}
  });

  charts.logMode = new Chart(document.getElementById("chart-log-mode"), {
    type: "bar",
    data: {labels: d.shippingModes.map(s=>s.mode), datasets:[
      {label:"Avg Actual Days", data:d.shippingModes.map(s=>s.avgActual), backgroundColor:"#2E75B6"},
      {label:"Avg Scheduled Days", data:d.shippingModes.map(s=>s.avgScheduled), backgroundColor:"#9DC3E6"}
    ]},
    options: {responsive:true, plugins:{legend:{position:"bottom", labels:{boxWidth:10,font:{size:10}}}}, scales:{x:{ticks:{font:{size:9}}}, y:{ticks:{font:{size:10}}}}}
  });

  charts.logStatus = new Chart(document.getElementById("chart-log-status"), {
    type: "doughnut",
    data: {labels: d.deliveryStatusBreakdown.map(s=>s.status), datasets:[{data:d.deliveryStatusBreakdown.map(s=>s.count), backgroundColor:["#C0392B","#2E7D32","#2E75B6","#8A8F98"]}]},
    options: {responsive:true, plugins:{legend:{position:"right", labels:{boxWidth:10,font:{size:10}}}}}
  });

  const regionRows = d.regionBreakdown.map(r => `<tr><td>${r.region}</td><td>${fmtCurrency(r.sales)}</td></tr>`).join("");
  document.getElementById("log-region-table").innerHTML = `
    <table><thead><tr><th>Region</th><th>Sales</th></tr></thead><tbody>${regionRows}</tbody></table>
  `;
}

function renderCustomer(d) {
  const el = document.getElementById("page-customer");
  el.innerHTML = `
    <div class="grid-2b">
      <div class="card">
        <h3>Top 10 Customers <span style="font-weight:400;color:var(--gray-text);font-size:11px;">(click a row to drill through)</span></h3>
        <div class="table-scroll" id="cust-top-customers"></div>
      </div>
      <div class="card">
        <h3>Top 10 Products</h3>
        <div class="table-scroll" id="cust-top-products"></div>
      </div>
    </div>
    <div class="grid-2b">
      <div class="card"><h3>Customer Segment</h3><canvas id="chart-cust-segment"></canvas></div>
      <div class="card"><h3>Profit by Customer (top 10, sales vs profit)</h3><canvas id="chart-cust-scatter"></canvas></div>
    </div>
  `;
  destroyChart("custSegment"); destroyChart("custScatter");

  const custRows = d.topCustomers.map(c => `
    <tr class="clickable" data-cid="${c.id}"><td>${c.name}</td><td>${c.segment}</td><td>${fmtCurrency(c.sales)}</td><td>${fmtCurrency(c.profit)}</td></tr>
  `).join("");
  document.getElementById("cust-top-customers").innerHTML = `
    <table><thead><tr><th>Customer</th><th>Segment</th><th>Sales</th><th>Profit</th></tr></thead><tbody>${custRows}</tbody></table>
  `;
  document.querySelectorAll("#cust-top-customers tr.clickable").forEach(tr => {
    tr.addEventListener("click", () => {
      drillCustomerId = parseInt(tr.dataset.cid);
      switchPage("detail");
      renderDetail(DASHBOARD_DATA.markets[currentMarket]);
    });
  });

  const prodRows = d.topProducts.map(p => `
    <tr><td>${p.name}</td><td>${p.category}</td><td>${fmtCurrency(p.sales)}</td><td>${fmtNum(p.units)}</td></tr>
  `).join("");
  document.getElementById("cust-top-products").innerHTML = `
    <table><thead><tr><th>Product</th><th>Category</th><th>Sales</th><th>Units</th></tr></thead><tbody>${prodRows}</tbody></table>
  `;

  charts.custSegment = new Chart(document.getElementById("chart-cust-segment"), {
    type: "pie",
    data: {labels: d.segmentBreakdown.map(s=>s.segment), datasets:[{data:d.segmentBreakdown.map(s=>s.count), backgroundColor:["#1F3864","#2E75B6","#9DC3E6"]}]},
    options: {responsive:true, plugins:{legend:{position:"right", labels:{boxWidth:10,font:{size:10}}}}}
  });

  charts.custScatter = new Chart(document.getElementById("chart-cust-scatter"), {
    type: "scatter",
    data: {datasets:[{label:"Customers", data:d.topCustomers.map(c=>({x:c.sales,y:c.profit})), backgroundColor:"#2E75B6"}]},
    options: {responsive:true, plugins:{legend:{display:false}}, scales:{x:{title:{display:true,text:"Sales",font:{size:10}}, ticks:{font:{size:9}}}, y:{title:{display:true,text:"Profit",font:{size:10}}, ticks:{font:{size:9}}}}}
  });
}

function renderOps(d) {
  const el = document.getElementById("page-ops");
  el.innerHTML = `
    <div class="demand-banner">Demand-based operational view — this dataset has no live inventory feed, so these visuals infer operational signals from order volume instead.</div>
    <div class="grid-2b">
      <div class="card"><h3>Fast-Moving Products (top 5 by units)</h3><canvas id="chart-ops-fast"></canvas></div>
      <div class="card"><h3>Slow-Moving Products (bottom 5 by units)</h3><canvas id="chart-ops-slow"></canvas></div>
    </div>
    <div class="grid-2b">
      <div class="card"><h3>Regional Demand</h3><canvas id="chart-ops-region"></canvas></div>
      <div class="card"><h3>Monthly Order Volume</h3><canvas id="chart-ops-volume"></canvas></div>
    </div>
  `;
  destroyChart("opsFast"); destroyChart("opsSlow"); destroyChart("opsRegion"); destroyChart("opsVolume");

  charts.opsFast = new Chart(document.getElementById("chart-ops-fast"), {
    type: "bar",
    data: {labels: d.fastMovers.map(p=>p.name), datasets:[{label:"Units", data:d.fastMovers.map(p=>p.units), backgroundColor:"#2E7D32"}]},
    options: {indexAxis:"y", responsive:true, plugins:{legend:{display:false}}, scales:{x:{ticks:{font:{size:9}}},y:{ticks:{font:{size:9}}}}}
  });
  charts.opsSlow = new Chart(document.getElementById("chart-ops-slow"), {
    type: "bar",
    data: {labels: d.slowMovers.map(p=>p.name), datasets:[{label:"Units", data:d.slowMovers.map(p=>p.units), backgroundColor:"#C0392B"}]},
    options: {indexAxis:"y", responsive:true, plugins:{legend:{display:false}}, scales:{x:{ticks:{font:{size:9}}},y:{ticks:{font:{size:9}}}}}
  });
  charts.opsRegion = new Chart(document.getElementById("chart-ops-region"), {
    type: "bar",
    data: {labels: d.regionBreakdown.map(r=>r.region), datasets:[{label:"Sales as demand proxy", data:d.regionBreakdown.map(r=>r.sales), backgroundColor:"#2E75B6"}]},
    options: {responsive:true, plugins:{legend:{display:false}}, scales:{x:{ticks:{font:{size:8}, maxRotation:60}},y:{ticks:{font:{size:9}}}}}
  });
  charts.opsVolume = new Chart(document.getElementById("chart-ops-volume"), {
    type: "line",
    data: {labels: d.monthlyTrend.map(m=>m.month), datasets:[{label:"Orders (sales as proxy)", data:d.monthlyTrend.map(m=>m.sales), borderColor:"#1F3864", backgroundColor:"#1F386422", fill:true, tension:0.25}]},
    options: {responsive:true, plugins:{legend:{display:false}}, scales:{x:{ticks:{font:{size:8}, maxRotation:60}},y:{ticks:{font:{size:9}}}}}
  });
}

function statusBadge(status) {
  if (status.toLowerCase().includes("late")) return `<span class="badge late">${status}</span>`;
  if (status.toLowerCase().includes("advance")) return `<span class="badge advance">${status}</span>`;
  if (status.toLowerCase().includes("cancel")) return `<span class="badge canceled">${status}</span>`;
  return `<span class="badge ontime">${status}</span>`;
}

function renderDetail(d) {
  const el = document.getElementById("page-detail");
  let rows = DASHBOARD_DATA.orderDetail;
  if (currentMarket !== "All") rows = rows.filter(r => r.market === currentMarket);

  let backHtml = "";
  let filteredRows = rows;
  if (drillCustomerId !== null) {
    const custMatch = DASHBOARD_DATA.markets["All"].topCustomers.find(c => c.id === drillCustomerId);
    const custName = custMatch ? custMatch.name : ("Customer " + drillCustomerId);
    filteredRows = rows.filter(r => r.customer === custName);
    backHtml = `<div class="back-link" style="display:block;" id="backLink">&larr; Back to all orders (currently filtered to ${custName})</div>`;
  }

  const tableRows = filteredRows.slice(0, 100).map(r => `
    <tr>
      <td>${r.orderId}</td><td>${r.customer}</td><td>${r.product}</td>
      <td>${r.shippingMode}</td><td>${statusBadge(r.deliveryStatus)}</td>
      <td>${fmtCurrency(r.sales)}</td><td>${fmtCurrency(r.profit)}</td><td>${r.deliveryDays}</td>
    </tr>
  `).join("");

  el.innerHTML = `
    ${backHtml}
    <div class="card">
      <h3>Order Detail ${drillCustomerId !== null ? "(drill-through)" : ""}</h3>
      <div class="note">Prototype shows a 300-row sample (top orders by sales value) — the real Power BI table would show every row live from FactOrders.</div>
      <div class="table-scroll" style="max-height:520px;">
        <table>
          <thead><tr><th>Order Id</th><th>Customer</th><th>Product</th><th>Ship Mode</th><th>Status</th><th>Sales</th><th>Profit</th><th>Delivery Days</th></tr></thead>
          <tbody>${tableRows}</tbody>
        </table>
      </div>
    </div>
  `;
  const back = document.getElementById("backLink");
  if (back) back.addEventListener("click", () => { drillCustomerId = null; renderDetail(d); });
}

/* ================= MAIN RENDER ================= */
function renderAll() {
  const d = DASHBOARD_DATA.markets[currentMarket];
  renderExec(d);
  renderLogistics(d);
  renderCustomer(d);
  renderOps(d);
  drillCustomerId = null;
  renderDetail(d);
}

renderAll();
</script>
</body>
</html>
